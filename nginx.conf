worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone for NGINX edge protection
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream backend {
        server backend:3001;
    }

    server {
        listen 80;
        server_name localhost;

        # Next.js Frontend proxy (assuming it's hosted elsewhere or built statically, for now just API)
        # If we serve frontend via Nginx, we'd add it here. For CTRL, the backend serves API.

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Edge rate limiting applied
            limit_req zone=api_limit burst=20 nodelay;
        }

        # Health check endpoint for load balancers
        location /health {
            access_log off;
            return 200 'OK';
        }
    }
}
